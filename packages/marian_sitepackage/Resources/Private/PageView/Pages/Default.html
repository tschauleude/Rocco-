<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default" />

<f:section name="Content">
    <article class="page page--default">
        <f:if condition="{data.title}">
            <header class="page__header">
                <h1 class="page__title">
                    <f:if condition="{data.subtitle}">
                        <f:then>{data.subtitle}</f:then>
                        <f:else>{data.title}</f:else>
                    </f:if>
                </h1>
                <f:if condition="{data.abstract}">
                    <p class="page__abstract">{data.abstract}</p>
                </f:if>
            </header>
        </f:if>

        <div class="page__content">
            <f:cObject typoscriptObjectPath="lib.dynamicContent" data="{colPos: 0}" />
        </div>
    </article>
</f:section>
</html>
