<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default" />

<f:section name="Main">
    <f:variable name="detailPid" value="{f:if(condition: settings.detailPid, then: settings.detailPid, else: settings.projectDetailPid)}" />

    <f:if condition="{grouped}">
        <f:then>
            <f:for each="{groups}" as="projects" key="status">
                <section class="project-group project-group--{status}">
                    <h3 class="project-group__title">
                        {statuses.{status}}
                        <span class="project-group__count">{projects -> f:count()}</span>
                    </h3>

                    <div class="grid grid--cards">
                        <f:for each="{projects}" as="project">
                            <f:render partial="Project/Card" arguments="{project: project, detailPid: detailPid, settings: settings}" />
                        </f:for>
                    </div>
                </section>
            </f:for>
        </f:then>
        <f:else>
            <div class="grid grid--cards">
                <f:for each="{projects}" as="project">
                    <f:render partial="Project/Card" arguments="{project: project, detailPid: detailPid, settings: settings}" />
                </f:for>
            </div>
        </f:else>
    </f:if>

    <f:if condition="{projects -> f:count()} == 0">
        <p class="notice">Noch kein Projekt angelegt. Jede Sammlung fängt mit einem an.</p>
    </f:if>
</f:section>
</html>
