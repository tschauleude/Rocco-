<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:if condition="{orders}">
    <f:then>
        <table class="order-list">
            <thead>
                <tr>
                    <th>Bestellnummer</th>
                    <th>Datum</th>
                    <th class="is-numeric">Summe</th>
                    <th>Stand</th>
                    <th><span class="is-visually-hidden">Details</span></th>
                </tr>
            </thead>
            <tbody>
                <f:for each="{orders}" as="order">
                    <tr>
                        <td>{order.orderNumber}</td>
                        <td><f:format.date format="d.m.Y">{order.orderedAt}</f:format.date></td>
                        <td class="is-numeric">{order.formattedTotal}</td>
                        <td>
                            <span class="badge badge--{order.status}">{order.statusLabel}</span>
                            <span class="badge badge--payment-{order.paymentStatus}">{order.paymentStatusLabel}</span>
                        </td>
                        <td><f:link.action action="order" arguments="{order: order}">Ansehen</f:link.action></td>
                    </tr>
                </f:for>
            </tbody>
        </table>
    </f:then>
    <f:else>
        <p class="notice">Noch keine Bestellung.</p>
    </f:else>
</f:if>
</html>
